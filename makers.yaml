rogier-bosschaart:
  bio: Rogier Bosschaart builds his paintings from thousands of meticulously placed dots — a practice of “expansion through limitation” that turns a single, repeated unit into dense, shifting fields of
    colour, suspended between chaos and control.
  category: artist
  hover: t-rogier-bosschaart-bubbels-work.jpg
  hover_small: h-rogier-bosschaart-bubbels-work.jpg
  in_brief:
  - text: Get ready for the playback, Yacay, Amsterdam
    year: '2026'
  - text: MA W Wynwood Pop-up, Miami Art Week, Miami
    year: '2024'
  - text: Untitled//unfinished, BlowUp Gallery, Amsterdam
    year: 2022–23
  instagram: https://www.instagram.com/rogier_bosschaart
  kind: maker
  name: Rogier Bosschaart
  portrait: portrait-rogier-bosschaart.jpg
  portrait_small: p-portrait-rogier-bosschaart.jpg
  position:
  - 'Within GROUND, Rogier Bosschaart holds the season''s most granular layer: a ground built not from a single gesture but from thousands of repeated ones. His practice takes the smallest available unit,
    the dot, and lets discipline, repeated long enough, become its own form of expression.'
  - Where other practices in this season find ground in body, memory or material residue, Bosschaart finds it in accumulation itself — order emerging from chaos not by resolving it but by repeating through
    it. That patience, and what it produces, is what makes his presence in this season essential.
  practice:
  - 'Rogier Bosschaart works between Amsterdam and Miami, at the intersection of the naïve and the calculated. His paintings are built from thousands of meticulously placed dots, a method he describes as
    expansion through limitation: a single simple unit, repeated with obsessive precision, until it becomes a field too dense to read as separate marks and too alive to read as pattern.'
  - 'No dot carries weight on its own. Only in accumulation — thousands of decisions repeated across months — does the image appear, and even then it keeps shifting: colours that seem to breathe, forms
    that rearrange the moment the eye looks away. The paintings sit deliberately between control and the chaos that control keeps trying to organise.'
  - 'The process itself is meditative, a mandala-like concentration held over long stretches of time, and the finished work asks the same of the viewer: slow down, keep looking.'
