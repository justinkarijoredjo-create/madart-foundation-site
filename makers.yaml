  portrait_small: p-portrait-inge-becka.jpg
  position:
  - Most of Bečka's work is object, not vessel — pieces built to be looked at rather than used, even where the form recalls something functional.
  - 'In Maison d''Artiste that distinction sits inside a room built for living: porcelain pushed to the edge of its own discipline, placed in a domestic setting without being domesticated by it. What happens
    with a piece after acquisition is, of course, entirely up to its owner.'
  practice:
  - Inge Bečka was born in The Hague in 1963 and works porcelain the way other sculptors work bronze, pushing a material known for restraint into folds, curls and stacked ridges that look improvised but
    are staged with total control. Since 2012 she has spent part of every year working in Jingdezhen, China, the world capital of porcelain, where the technical vocabulary of the material has become second
    nature to her.
  - 'Her forms begin from a single decisive gesture — a fold, a curl, a ridge — repeated across a series until each piece carries its own variation on the same movement. What reads as chance is entirely
    composed: the material''s apparent spontaneity is the result of exact, practised handling, glazed in surfaces that shift between glossy silver, matte steel and gold.'
  - She lives and works in the Beemster and trained under the ceramicist Marjan de Voogd.
