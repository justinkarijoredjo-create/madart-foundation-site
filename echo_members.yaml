- slug: maaike-rabbinge
  name: Maaike Rabbinge
  role: Initiator and maker
  studio: Eenvoud Ontwerp
  instagram: https://www.instagram.com/eenvoudontwerp
  works:
  - echo-conduit-chair
  - echo-latch-bench
  - echo-latch-stool
  bio: Works from the conviction that what already exists carries its own design logic. For ECHO, which she initiated,
    she used the access panels from street lighting poles — components designed to stay hidden inside the structure.
    She brought them out.
  practice:
  - Maaike Rabbinge works under the name Eenvoud Ontwerp, from the conviction that what already exists contains
    its own design logic. She works with dimensions, connections and traces of previous use — letting the material
    decide the outcome rather than imposing a predetermined form.
  position:
  - 'As both initiator and participating maker, Rabbinge occupies a particular position in ECHO. Her three works
    demonstrate the premise of the whole: that overlooked industrial material, attended to with care, reveals its
    own structural and aesthetic logic.'
  - For this edition she worked with aluminium access panels from the production of street lighting poles — components
    designed to remain hidden inside the structure. She brought them out.
- slug: coen-beeksma
  name: Coen Beeksma
  studio: Studio Beeks
  instagram: https://www.instagram.com/studiobeeks
  works:
  - echo-2-1-bench
  bio: 'Furniture design and material research, with a focus on honest construction. His bench is the only piece
    in ECHO combining two structural materials: solid oak and reclaimed aluminium.'
  practice:
  - Coen Beeksma works under the name Studio Beeks, at the intersection of furniture design and material research,
    with a consistent focus on honest construction and the inherent qualities of the materials he works with.
  position:
  - '2.1 — Bench is the only piece in ECHO that combines two structural materials: solid oak and reclaimed aluminium.
    The contrast is deliberate — warmth and industrial cool, each making the other more visible. It was made once,
    for this exhibition.'
- slug: sophie-wantia
  name: Sophie Wantia
  studio: Studio Wantia
  instagram: https://www.instagram.com/studio_wantia
  works:
  - echo-alu-weave-01
  bio: 'Graphic and playful pattern, driven by textile and colour. She used aluminium tubes as a weaving material:
    the only textile work in ECHO. The tubes are still tubes, and also warp and weft.'
  practice:
  - Studio Wantia is a design studio focused on graphic and playful pattern. Driven by textile, colour and research,
    the studio explores pattern as a hybrid, cross-disciplinary form.
  position:
  - Alu Weave 01 is the only textile work in ECHO. It sits on the floor among objects that stand and hold and pour,
    and asks what the material becomes when the structure is woven rather than cast, extruded or welded. The tubes
    are still tubes. They are also warp and weft.
  - 'The work emerged from an intuitive process of curiosity rather than a predetermined outcome: play as a method
    of making.'
- slug: frank-penders
  name: Frank Penders
  instagram: https://www.instagram.com/frank_penders
  works:
  - echo-billet
  - echo-yield
  bio: Material research and spatial presence, combining aluminium with local Douglas fir and elm. Not expression
    as a goal, but presence as a prerequisite.
  practice:
  - Frank Penders is a designer and maker whose work is grounded in material research and spatial presence. He works
    with local and residual materials — aluminium, Douglas fir, elm — combining them through precise, considered
    construction.
  - 'A guiding principle in his practice: not expression as a goal, but presence as a prerequisite. The work does
    not declare itself. It occupies space and holds its ground.'
  position:
  - 'Penders contributes two functional objects: a floor lamp and a side table, both made from Nedal aluminium combined
    with locally sourced wood. Each is unique in its material combination. Together they demonstrate that residual
    material can carry the full weight of considered design.'
- slug: erwin-woldring
  name: Erwin Woldring
  studio: EWOL
  instagram: https://www.instagram.com/ewol_guitars
  works:
  - echo-bracelet
  - echo-knik-knak-lamp
  bio: A craftsman known for handmade electric guitars. He contributes the two most contrasting objects in ECHO
    — a lamp that anchors a room and a bracelet worn against skin, from the same discarded stock. The difference
    in scale is the point.
  practice:
  - Erwin Woldring works under the name EWOL. He is a craftsman and product designer known primarily for his handmade
    electric guitars, each individually stamped with a logo and serial number. His practice is rooted in material
    honesty and the pursuit of form through direct making.
  position:
  - At Nedal, aluminium residue from tube production — 100% pre-consumer waste — becomes the raw material for objects
    that are as rigorous as they are unexpected.
  - 'EWOL contributes two of the most physically contrasting objects in ECHO: a lamp that could anchor a room, and
    a bracelet worn against skin. Both are made from the same discarded stock. The difference in scale is the point.'
- slug: marc-th-van-der-voorn
  name: Marc Th. van der Voorn
  instagram: https://www.instagram.com/marc.th.vandervoorn
  works:
  - echo-candleswitch
  bio: 'Designs flexible connections that shift with whatever residual aluminium is at hand. The most domestic object
    in ECHO: material that once carried current through a street pole now holds a flame.'
  practice:
  - Marc Th. van der Voorn is a product designer working hands-on and collaboratively, where material exploration
    and development are closely connected. His aim is to develop consumer products together with manufacturers and
    brands — objects that begin as singular experiments and open up into series.
  position:
  - 'For ECHO he focused on flexible connections: designs that shift depending on the specific piece of residual
    aluminium available. Each CandleSwitch is shaped by what the material allows.'
  - It is the most domestic object in ECHO — a candleholder of structural aluminium offcuts combined with azobé,
    a dense tropical hardwood. It sits on a table. It holds a candle. The material that once carried current through
    a street pole now holds a flame.
- slug: jeroen-van-veluw
  name: Jeroen van Veluw
  instagram: https://www.instagram.com/studiojeroenvanveluw
  works:
  - echo-col-krukje
  - echo-col-sokkel
  bio: Designs for permanence, shaped by an interest in animism and by growing up in Ghana. Two objects under one
    title, one anodised and one raw, asking what aluminium becomes when it is treated as material worth attending
    to.
  practice:
  - Jeroen van Veluw is a product and exhibition designer based in Utrecht. His work is shaped by a deep interest
    in animism — the belief that objects carry their own spirit, their own relational weight. In a culture of rapid
    replacement, he designs for permanence.
  - 'Growing up in Ghana shaped his understanding of material care and local production. His practice reflects both:
    attentive to the specific qualities of each material, invested in the collaborative process between maker and
    end-user.'
  position:
  - 'Van Veluw contributes two objects under the shared title Col — a stool and a pedestal, one anodised, one raw.
    Together they occupy the same space and ask the same question: what does aluminium become when it is treated
    not as infrastructure, but as material worth attending to?'
- slug: ritsert-mans
  name: Ritsert Mans
  instagram: https://www.instagram.com/ritsertmans
  works:
  - echo-drop
  - echo-flashlight
  bio: 'Explores how materials are experienced once removed from their original context. He brings two registers:
    a bowl that looks like it grew, and a flashlight that looks like a drawing of one.'
  practice:
  - Ritsert Mans explores the relationship between technology, nature and perception. His work investigates how
    materials, objects and systems can be experienced differently when removed from their original context.
  position:
  - 'Mans brings two registers to ECHO: the contemplative and the comic. A bowl that looks like it grew. A flashlight
    that looks like a drawing of a flashlight. Both made from the same Nedal remnant. The distance between them
    is the work.'
- slug: cynthia-kevin-kars-boom
  name: Cynthia & Kevin Kars-Boom
  studio: Studio Kars + Boom
  instagram: https://www.instagram.com/karsenboom
  works:
  - echo-formscape
  bio: Colour, rhythm and material reduced to their essence. Where most of ECHO speaks in silver and grey, they
    wrap the aluminium in vinyl, paint and rope. The poles are still recognisable, and also something else entirely.
  practice:
  - Studio Kars + Boom operates at the intersection of art and design. Driven by curiosity, Cynthia and Kevin translate
    observations of the world around them into colourful compositions, objects, installations and imagined environments.
  - By reducing forms to their essence they create space for the imagination. Their work is accessible but layered
    — playful in character, attentive to meaning. Colour, rhythm and material form the foundation of their visual
    language.
  position:
  - Formscape brings colour into ECHO. Where most works in the collective speak in silver and grey, Kars-Boom introduce
    vinyl, paint and rope, wrapping the aluminium in layered meaning. The poles are still recognisable. They are
    also something else entirely.
- slug: billie-jo-krul
  name: Billie-Jo Krul
  instagram: https://www.instagram.com/billiejo.fotografie
  works:
  - echo-here-comes-the-sun
  - echo-hole-in-my-heart
  - echo-still-standing
  bio: A Dutch-Canadian photographer using the camera for emotional archaeology. Street lighting poles recur throughout
    her work — not as infrastructure, but as stand-ins for human presence. Where the others transform the residue
    of production, she transforms the residue of experience.
  practice:
  - Billie-Jo Krul is a Dutch-Canadian photographer with a background in art history from Utrecht University. Her
    work moves between photography and fine art, using the camera as a tool for emotional archaeology.
  - Her ongoing series Broad Daylight was born from a period of grief — a sustained attempt to give form to what
    cannot easily be spoken. In 2025 the series received a FEP Merit Award in the category Illustration & Fine Art.
  - Street lighting poles recur throughout her work — not as infrastructure, but as stand-ins for human presence.
    Upright, patient, unremarkable until the light fails.
  position:
  - Within ECHO, Krul brings the emotional register. Her three photographs are made on aluminium — the same material
    the other makers shape by hand. Where the others transform the residue of production, she transforms the residue
    of experience.
- slug: jan-willem-van-elten
  name: Jan Willem van Elten
  instagram: https://www.instagram.com/janwillemvanelten
  works:
  - echo-rest
  bio: 'Economy of means: as much as possible with as little as necessary. REST is made from a single profile that
    was already out of spec when it left the factory. It had its first life in a system. Now it holds a glass.'
  practice:
  - 'Jan Willem van Elten is a designer with a background in product and spatial design. His practice is defined
    by economy of means: doing as much as possible with as little as necessary. He works with found and residual
    materials, using their existing properties as the starting point for form.'
  position:
  - REST is made from a single piece of scrap — an aluminium extrusion profile that was already out of spec when
    it left the factory. Van Elten made something to sit beside. The material had its first life in a system. Now
    it holds a glass.
- slug: frederik-wasseur
  name: Frederik Wasseur
  role: Welder at Nedal
  instagram: https://www.instagram.com/fre.wasseur
  works:
  - echo-spectral-form
  - echo-what-is-the-ripple
  bio: An aluminium expert welder at Nedal, he knows the material from the inside. His work begins with the profiles
    that fail quality control. He is the only maker present at the moment the material is refused, and that proximity
    is inseparable from the work.
  practice:
  - Frederik Wasseur works as an aluminium expert welder at Nedal, involved daily in the production of aluminium
    extrusion profiles. He knows the material from the inside — its tolerances, its failures, its silences.
  - 'His work begins with the profiles that do not make it through quality control: pieces marked by distortion,
    irregularity or imperfection. Where the production process sees a reject, Wasseur sees a form.'
  position:
  - Spectral Form is the only work in ECHO made by someone with direct access to the source. Wasseur does not work
    from residue that arrives at a studio — he is present at the moment the material is refused. That proximity
    is inseparable from the work.
- slug: zowa-rindt
  name: Zowa Rindt
  studio: ZOWA
  instagram: https://www.instagram.com/zowa___
  works:
  - echo-sway
  bio: 'Designs without unnecessary additions: no superfluous components, no finish applied from outside. The surface
    is the result of making, not of coating. Sway is three parts and no decoration. The lamp does not announce itself.
    It stands.'
  practice:
  - 'ZOWA designs objects with a focus on material and simplicity. The aim is to design without unnecessary material
    additions: every visible part or detail not only serves a visual role but also contributes to the functionality
    of the whole.'
  - No superfluous components. No additional finishing techniques or colour applied from outside. Instead the material
    is worked until it achieves the desired appearance — the surface as the result of making, not of coating.
  position:
  - Sway is a light object built from a baseplate, a cap and a stainless steel rod. Three components. No decoration.
    The aluminium parts are Nedal residue. The lamp does not announce this. It simply stands.
- slug: aleksandra-sliwinska
  name: Aleksandra Śliwińska
  studio: WE ARE MAK STUDIO
  instagram: https://www.instagram.com/wearemakstudio
  works:
  - echo-bobber-lamp
  - echo-melt-lamp-001
  bio: 'Works with raw material and purity of form, letting the qualities of the material carry the object rather than hiding them. For ECHO she turns Nedal aluminium residue into two lamps: one gathers tubes into a volume, the other tears a single pipe open. Both let light pass through a material that carried none.'
  practice:
  - 'WE ARE MAK STUDIO is a Polish-Dutch design duo based in Amsterdam, founded by Aleksandra Śliwińska and Loran van Gerwen. Their practice is rooted in a love for nature, raw materials and purity of form — foregrounding the qualities of material rather than concealing them. Colour is a recurring presence: not decoration, but self-expression and playfulness. The studio works across scales, from interior architecture to objects, with the same underlying conviction that honest materials, handled with care, produce something lasting.'
  - 'Loran van Gerwen co-founded the studio and contributes to its spatial and material thinking across all projects.'
  position:
  - 'WE ARE MAK STUDIO enters ECHO with two lamp objects that treat Nedal aluminium residue as the starting point for form. Bobber gathers tubes into a cylindrical volume that diffracts light through its structure. Melt presents a single pipe whose opening has been torn rather than cut, revealing a warm interior. Both allow light to pass through a material that once carried none.'
- slug: milou-bergs-edwin-van-capelleveen
  name: Milou Bergs & Edwin van Capelleveen
  studio: 10-4 Studio
  instagram: https://www.instagram.com/10_4studio
  works:
  - echo-flux
  bio: 'A design studio founded by Milou Bergs and Edwin van Capelleveen, based in Eindhoven. They design products and custom interior elements that balance thoughtful usability with an unexpected formal language.'
  practice:
  - '10-4 Studio was founded by Milou Bergs and Edwin van Capelleveen and works from Eindhoven. They design products and custom interior elements that balance thoughtful usability with an unexpected formal language.'
  - 'The objects are rarely decorative and never only functional: a door handle, a closet pull, a coat hook. Things that are handled every day and still hold a shape you have to look at twice.'
  position:
  - 'Every tapered lamppost starts as a straight aluminium tube. Once the lamppost is finished, the clamped end is cut off and discarded. Flux is made from that offcut. Sliced into thin cross-sections, it reveals a pattern the machine left behind — a fingerprint of the process. No two are alike.'
- slug: joris-wintgens
  name: Joris Wintgens
  studio: OFFSITE
  instagram: https://www.instagram.com/offsite______/
  works:
  - echo-twirl-stool-s
  bio: 'OFFSITE designs furniture and objects from industrial waste. Offcuts, rejected batches, surplus stock, leftover formats: the material comes first. They design around what exists. Form follows constraint, not the other way round.'
  practice:
  - 'OFFSITE designs furniture and objects from industrial waste. Offcuts, rejected batches, surplus stock, leftover formats: the material comes first, and the design follows from what is already there.'
  - 'That order is the whole method. A batch decides a dimension, a leftover format decides a proportion. Form follows constraint, not the other way round, and a series never runs longer than the material allows.'
  position:
  - 'Twirl Stool S is a single piece: waxed Nedal aluminium, oak and stainless steel, brought together at the scale of one stool and no further. In a collective built on one stream of residual material, it is the work that shows what a constraint looks like once you sit on it.'
