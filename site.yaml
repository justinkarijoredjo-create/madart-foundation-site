seasons:
- slug: seizoen-02-ground
  curated_by_foundation: true
  number: '02'
  title: GROUND
  status: past
  start: 2026-07-03
  end: 2026-09-30
  dates_label: 3 July – 30 September 2026
  location: Het Metzgebouw, fourth floor
  hero: hero-ground-01.jpg
  card: c-exhibition-ground.jpg
  hero_images:
  - file: hero-ground-01.jpg
    alt: 'Gallery 4: paintings by Loutje Hoekstra above work by the sixteen makers of ECHO on the gallery floor'
  - file: hero-ground-02.jpg
    alt: 'Gallery 2: faceted volumes from Aad Kruiswijk''s MineralisM series on the floor, dot paintings by Rogier Bosschaart on the wall'
  - file: hero-ground-03.jpg
    alt: 'Gallery 3: a woven work by Sandra Keja Planken'
  standfirst: The common ground shared by maker, Foundation and visitor alike. Not a stage built on favour. A foundation built on conviction.
  body:
  - 'GROUND asks what a practice stands on. Not the finished position, but what lies underneath it: a material, a body, a discipline held long enough to become a floor.'
  - 'The season puts that question twice in the same room. In Gallery 2, Rogier Bosschaart''s dot paintings hold the wall while Aad Kruiswijk''s robot-cut volumes hold the floor — accumulation against constraint,
    both arriving at a form neither of them chose. Gallery 4 repeats the figure: Loutje Hoekstra''s body prints on the walls, and beneath them the sixteen makers of ECHO working a single stream of residual
    aluminium. Two rooms stand alone. Anne van Borselen, born in 1937 and still casting, has Gallery 1. Sandra Keja Planken has Gallery 3, where weaving and passementerie are slowed down until the technique
    becomes the subject.'
  - Arno Hoogland holds the Gallery Lounge, where the floor begins. His panels are the only work here that faces forward rather than down; everything past them is excavation. Six makers and a collective,
    one floor, and no agreement between them about what the ground is made of.
  programme: ground
- slug: seizoen-01-paradox
  curated_by_foundation: false
  number: '01'
  title: PARADOX
  status: past
  start: 2026-04-01
  end: 2026-07-01
  dates_label: 1 April – 1 July 2026
  location: Het Metzgebouw
  hero: null
  card: c-exhibition-paradox.jpg
  standfirst: Where opposites no longer hold.
  body:
  - 'Season 01 ran at Het Metzgebouw from April to July 2026 under the title PARADOX: work that holds two things at once without resolving them.'
  - PARADOX ran under a different model. Galleries took the floor for the season and presented the makers they represent. The Foundation did not exist yet, and the concept was another one.
  - 'It is counted as a season because the floor was programmed for three months. It is not counted in the thirty makers, because those are the makers the Foundation curates itself, and that began with
    Season 02. What PARADOX settled was the question of what this should become: supporting makers rather than representing galleries.'
  - Documentation of this season is being assembled. Installation photography, the maker list and the wall texts will be published here.
  programme: paradox
- number: '03'
  slug: seizoen-03-inline
  curated_by_foundation: true
  title: INLINE
  programme: inline
  status: current
  location: Het Metzgebouw, fourth floor
  dates_label: 21 October 2026 – 17 January 2027
  start: '2026-10-21'
  end: '2027-01-17'
  hero: null
  card: c-exhibition-inline.jpg
  standfirst: The line between online and offline no longer holds.
  body:
  - The line between online and offline no longer holds. What we see, make and experience
    unfolds in a reality that is both at once — layered, shifting, and no longer separable.
  - 'INLINE is the third season of MADART Foundation, bringing together six presentations
    that each approach the same tension from their own material, medium and visual language:
    what does it mean to make something in a world that always exists somewhere else too?'
  - 'Opening night: Wednesday 21 October 2026, 18:00–21:00, doors at 17:45. Entry is by
    contribution to MADART Foundation. The season is then open to the public from 22 October
    2026 through 17 January 2027, daily 10:00–18:00, free entry.'
place:
  image: place-nio-house.jpg
  alt: Het Metzgebouw at dusk, the 1891 Metz building reflected in the Keizersgracht
  title: Het Metzgebouw
  body:
  - A national monument on the corner of the Leidsestraat and the Keizersgracht. Built in 1891 for the New York Life Insurance Company — at 26 metres the tallest private building in the city, its facade
    still carrying the letters NY and the eagle of its first owner.
  - Metz & Co moved in during 1908 and furnished Amsterdam's interiors from here for over a century, bringing Rietveld, Bauhaus and Liberty of London to the city. In 1933 Gerrit Rietveld crowned the roof
    with a glass dome, built as an exhibition room. Le Corbusier and Mies van der Rohe showed their furniture there for the first time in the Netherlands. It is still there.
  - Metz & Co left in 2012. Abercrombie & Fitch occupied the building until the end of 2022, and in 2024 it reopened as Het Metzgebouw, restored by MVRDV.
  - The fourth floor is ours for the length of each season. It is not a rented hall dressed for an evening; it is a gallery floor that has meant something for three months before anyone walks in. That is
    the difference a maker feels, and a visitor feels it too.
team:
- name: Justin Karijoredjo
  role: Founder · Curatorial and Strategic Director
  portrait: team-justin.jpg
  portrait_small: p-team-justin.jpg
  body: 'Architect of the MADART ecosystem. He devises the concept, makes the connections and sets the direction: which makers get a room, which partners get a seat at the table, and where the ecosystem
    goes next. He has seen the commercial art world from the inside, and the curatorial choices come out of that experience rather than out of marketing.'
- name: Kimberly Tanikromo
  role: Managing Director · Operations and Partnerships
  portrait: team-kimberly.jpg
  portrait_small: p-team-kimberly.jpg
  body: Responsible for production and execution, commercial acquisition and grant management. Her background in artist management turns intention into a working season. She holds full power of attorney
    for Stichting The Bloys, the legal entity behind MADART Foundation.
