anne-van-borselen:
  bio: Anne van Borselen (b. 1937, Surabaya) brings a rare physical dynamism to her work, moving between painting, bronze and ceramic. She divides her life between Amsterdam and Bali, leaving a vivid trail
    balanced between the figurative and the abstract.
  category: artist
  hover: t-anne-van-borselen-arena.jpg
  hover_small: h-anne-van-borselen-arena.jpg
  instagram: https://www.instagram.com/annevanborselen
  kind: maker
  name: Anne van Borselen
  portrait: portrait-anne-van-borselen.jpg
  portrait_small: p-portrait-anne-van-borselen.jpg
  position:
  - Anne van Borselen paints because she paints; that has always been true. She comes from painters on both sides and has still found her own way — impulsive, direct, unfiltered.
  - Within GROUND she stands for the conviction that a voice of one's own is not created but found, and that a lifetime of persistence is the strongest proof that the voice is there.
  practice:
  - Anne van Borselen was born in Surabaya in 1937 and brings a rare physical dynamism to her work; the vitality is visible in every canvas. She moves between painting, bronze and ceramic, shifting material
    to match the emotion at hand.
  - Painting runs in the family on both sides. Her Indonesian mother painted too, and would wake her in the middle of the night to prepare canvases together and talk about art.
  - 'Her paintings carry a poetic commentary caught from lived moments, with stillness and introspection set against the movement. Abstraction is a consequence rather than an intention. She has to work
    fast, she says: a line has to be drawn quickly, because the scenes she wants to catch are themselves fleeting. She divides her life between Amsterdam and Bali, six months in each, and the trail she
    leaves behind stays balanced between the figurative and the abstract, with a figure or an animal surfacing throughout.'
  programme: ground
  slug: anne-van-borselen
  whatsapp: https://wa.me/31615884650?text=Hi%20Djamilla%2C%20I%27m%20interested%20in%20Anne%20van%20Borselen%27s%20work%20in%20MADART%20FOUNDATION%20Season%2002%20GROUND.
