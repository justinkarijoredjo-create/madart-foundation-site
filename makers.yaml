lilia-luganskaia-kuilder:
  bio: Amsterdam-based artist and designer working across object, light, and space. Using glass and interactive light, she creates sculptural objects that shape perception and invite moments of pause. Her
    current collection, Ritual, explores focus, grounding, and radical slowing down.
  category: artist
  hover: t-lilia-luganskaia-kuilder-ikebana-table.jpg
  hover_small: h-lilia-luganskaia-kuilder-ikebana-table.jpg
  in_brief:
  - text: Ritual premiered at Salone del Mobile.Milano
    year: '2026'
  - text: Paris Design Week · GLUE, Amsterdam
    year: '2026'
  - text: Rijksmuseum · Getty Research Institute · MACBA Barcelona · Martin Parr Foundation · UC Berkeley · FENIX Museum Rotterdam
    year: In collections
  - text: Ormaie Paris · Bea Bongiasca · Timo Kuilder × The New Yorker · MISC
    year: Collaborations
  instagram: https://www.instagram.com/lilialand
  kind: maker
  name: Lilia Luganskaia-Kuilder
  portrait: portrait-lilia-luganskaia-kuilder.jpg
  portrait_small: p-portrait-lilia-luganskaia-kuilder.jpg
  position:
  - 'Luganskaia-Kuilder''s authority sits in proportion rather than surface. Her glass is cut and graded according to Sogetsu ikebana, a discipline built on ratio, not decoration. That logic does not stay
    confined to a plinth: in a room built for living, an object proportioned for stillness needs no translating from gallery to house, because it was never separated from use in the first place.'
  - 'The light piece paces itself against the body — ten minutes, motion-activated, indifferent to whether anyone is watching. The mirror holds a threshold rather than a reflection of taste. The ikebana
    table arrives unfinished by design: a stage, not a statement, waiting on whoever enters the room to complete it, arrangement by arrangement, day by day.'
  - A maker's method proves itself differently once it has to hold its ground inside a domestic register — tested not by how it reads on a wall, but by how it behaves once someone sits down in front of
    it.
  practice:
  - Lilia Luganskaia-Kuilder works between object, image and space. Her practice spans sculptural object design, photography, film and artist books, centred on material presence and quiet visual rhythm,
    and moves between modernist form and the relationship between nature and constructed environments.
  - Using glass and interactive light, she builds works that shape perception through narrative design. Ritual, her current body of work, investigates focus, grounding and radical slowing down through sculptural
    glass objects and interactive light. It premiered at Salone del Mobile.Milano in 2026.
  - 'The light in Ritual is custom-programmed and has only two states: a guided breathing sequence, and a steady glow when nothing is near it.'
