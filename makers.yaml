jim-bob-ruijgrok:
  bio: Furniture maker and designer based in Eindhoven. Work built from solid oak, composed of repeating slat structures — rhythm, construction and craft visible in every object.
  category: artist
  hover: t-jim-bob-ruijgrok-eiken-latten-bank.jpg
  hover_small: h-jim-bob-ruijgrok-eiken-latten-bank.jpg
  in_brief:
