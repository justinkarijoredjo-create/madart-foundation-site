    - anchor: vr-workshop
      time: 13:00 – 15:00
      floor: 7
      room: the Rietveld dome
      title: Music experience and line art workshop
      who: Sami Abou Louh and Loutje Hoekstra
      body: A musical experience and a workshop all around the subject of circles — circling sounds in a circular space, circling motions towards swirling line drawings that embrace fluidity and motion.
      body2: Musician Sami Abou Louh opens the session with a live set crafted for the Rietveldkoepel, a circular space high above the city with sweeping views over Amsterdam. Participants are invited to
        listen and tune in, before Loutje Hoekstra, currently exhibiting at MADART Foundation but also known for her line drawings, leads a hands-on introduction to drawing as motion, flow and rhythm rather
        than structure.
      maker: loutje-hoekstra
      status: book
      places: 15
      book_url: https://www.eventbrite.com/checkout-external?eid=2000085446411
      book_label: Book
