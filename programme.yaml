      maker: inge-becka
      book_label: Book
    - anchor: do-talk-pirlica
      time: 13:30 – 14:00
      floor: 2
      room: the maker's presentation space
      title: 'The hospital: care or cure?'
      who: Andreea Pirlica
      language: In English
      body: Hospital rooms have the reputation of being notoriously ugly, uncomfortable, and unwelcoming. As clinical efficiency has taken over patient-centered care, the hospital has turned into a techno-utopia,
        and care has turned into cure.
      body2: Hospitals are designed to treat us, but are they designed to help us heal? Starting from my own experience as a patient, this lecture traces the history of the hospital room and brings together
        architectural analysis and patient experiences to explore how spaces of care have become spaces of cure — and what gets lost in between.
      maker: andreea-pirlica
      status: book
      places: 15
      book_url: https://www.eventbrite.com/checkout-external?eid=2000085446411
      book_label: Book
    - anchor: do-table-talk
      time: 14:00 – 14:45
      floor: 6
      title: MADART Table Talk
      who: Maaike Rabbinge, Loutje Hoekstra and Sandra Keja Planken, with Justin Karijoredjo
      body: Maaike Rabbinge studied psychology in Utrecht and political science in Amsterdam, became a circular designer, and now runs the collective ECHO. Loutje Hoekstra never went to an academy and taught
        herself everything she knows. Sandra Keja Planken spent a career as an interior architect before she began making autonomous work.
      speakers:
      - maaike-rabbinge
      - loutje-hoekstra
      - sandra-keja-planken
      page: madart-table-talk.html
      status: book
      places: 30
      book_url: https://www.eventbrite.com/checkout-external?eid=2000085446411
      body2: Three makers who arrived here by three different routes, and not one of them the route the system recognises. Dutch funds date a career from a first presentation inside the established circuit.
        Galleries want a signature they can place. Both measure a path that none of these three walked — and neither has anything to do with the quality of the work.
      note: Seated at a table by Ignore.
      body3: That is what MADART Foundation exists for, and it is easier to hear it from them than from us. They sit down at Ignore’s table and talk about how they got here, and about what they made for
        GROUND. Justin Karijoredjo leads the conversation.
      body4: Forty-five minutes, standing room.
      book_label: Book
    - anchor: do-wine
      time: 14:00 – 18:00
      floor: 4
      title: Wine bar
      who: VINVIN Wines and Bon Vivant
      body: Open through the afternoon on the gallery floor, between the work.
      status: free
    - anchor: do-talk-hofhuis
      time: 15:00 – 16:00
      floor: 2
      title: Colour in design
      who: Femke Hofhuis, Femm Amsterdam
      status: book
      speaker: Femke Hofhuis
      language: In Dutch
      body: Colour as a design tool. Designer Femke Hofhuis, founder of Femm Amsterdam, on the power of colour and of how a space is experienced. How does colour shape the way we feel, and the way we read
        a room?
      body2: And why are colour, light and art becoming more important in a world that keeps getting more digital? A talk about designing for the eye and for the feeling.
      book_url: https://www.eventbrite.com/checkout-external?eid=2000085446411
      book_label: Book
    - anchor: do-talk-otter
      time: 16:00 – 17:00
      floor: 2
      title: Where neuroscience, behaviour, design and business meet
      status: book
      speaker: Martijn den Otter
      who: Martijn den Otter, Neurofactor
      language: In Dutch
      body: Martijn den Otter is a neuroscientist, profiler and founder of Neurofactor. As a co-researcher he was involved in the Mauritshuis study of Girl with a Pearl Earring, which used EEG, eye-tracking
        and fMRI to examine what art does inside the human brain.
      body2: 'In his talk he brings those worlds together: what happens in the brain when we look at art, and how art, neurodesign and our surroundings shape the way we feel, think and function at work.
        With a live demonstration of a measurement.'
      book_url: https://www.eventbrite.com/checkout-external?eid=2000085446411
      book_label: Book
    - anchor: do-devoonsound
      time: 17:00 – 17:30
      floor: 7
      room: the Rietveld dome
      title: Devoonsound session
      body: Half an hour of sound written for the dome, at the end of the day.
      status: book
      places: 15
      book_url: https://www.eventbrite.com/checkout-external?eid=2000085446411
      who: Devoonsounds
      book_label: Book
    - anchor: do-opening
      time: 18:00 – 21:00
      floor: null
      title: Maison d'Artiste 2026 — Opening Night
      status: book
      who: With all thirty makers present
      body: The building closes to the public at six, and opens again for the evening. Eight floors of the Metzgebouw after hours, the makers there to talk about their work, and a sound session under Rietveld's
        glass dome as the light goes.
      body2: 'Welcome drink included. Wine by VINVIN Wines and Bon Vivant. Music on three floors
        at once: Devoonsounds under the dome on seven, Arthur Chapelle on solo guitar on six,
        and DJ ELLE-MAR on the gallery floor on four.'
      book_label: Tickets — € 10
      book_url: https://www.eventbrite.com/checkout-external?eid=2000330882517
      room: The whole building
      note: An evening opening of the Foundation’s own exhibition. Production is bought in from Curated by MADART at market rate.
      price_eur: 10
