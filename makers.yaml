andreea-pirlica:
  bio: Andreea Pirlica is an interior architect and spatial researcher working between the Netherlands and Romania. Her subject is the architecture of cure — the rooms built to hold people at their least
    autonomous. HEALING ROOMS reads the patient room from the position of the person lying down.
  category: artist
  hover: t-andreea-pirlica-healing-rooms.jpg
  hover_small: h-andreea-pirlica-healing-rooms.jpg
  in_brief:
  - text: Royal Academy of Art, The Hague — BA Interior Architecture & Furniture Design · Sandberg Instituut, Amsterdam — MA Interior Architecture
    year: Trained at
  - text: the Netherlands and Romania
    year: Based in
  instagram: https://www.instagram.com/aoleupirlica
  kind: maker
  name: Andreea Pirlica
  portrait: portrait-andreea-pirlica.jpg
  portrait_small: p-portrait-andreea-pirlica.jpg
  position:
  - 'Maison d''Artiste places makers inside a building designed to be lived in. Pirlica arrives with the opposite typology in hand: a room designed to be survived. Her work reads the domestic floor against
    the clinical one — what a bed means when it is furniture, and what it becomes when it is equipment.'
  - Among objects made for comfort, HEALING ROOMS asks why comfort is treated as optional at precisely the moment a body needs it most.
  practice:
  - Andreea Pirlica is an interior architect and spatial researcher working between the Netherlands and Romania. She trained at the Royal Academy of Art in The Hague and the Sandberg Instituut in Amsterdam,
    and her practice moves between interior design, installation, spatial analysis and medical anthropology.
  - 'Her subject is the architecture of cure: the rooms, wards and corridors built to hold people at their least autonomous. She works from the position of the person lying down rather than the one passing
    through, reading light, sound, schedule and furniture as instruments that either carry a recovery or quietly work against it.'
  - 'HEALING ROOMS began in December 2022, when Pirlica spent ten days in a hospital bed. Room 23 gave her the argument: a patient room is never a neutral container for recovery, it is an active participant
    in it. The book that followed is part document, part evidence, part proposal — a blueprint read from the inside.'
  programme: talks
  slug: andreea-pirlica
