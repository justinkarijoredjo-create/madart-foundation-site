  portrait_small: p-portrait-jim-bob-ruijgrok.jpg
  position:
  - 'As a furniture maker from Eindhoven, Ruijgrok builds on a distinct inheritance: that of his father and mentor Nob Ruijgrok, developed further after his passing into an independent collection of solid
    wood furniture.'
  - Within Maison d'Artiste the search is for the essence of a room through clear construction, repetition and rhythm. The furniture works as small-scale architecture, in which the joinery stays visible
    and the craft is legible in every detail.
  practice:
  - 'Jim Bob Ruijgrok is a furniture maker and designer working from Eindhoven. His work is rooted in craft: he designs, makes and finishes everything himself, from raw plank to finished piece, with no
    intermediary steps. That full involvement in every part of the process is what makes the work honest, intense and personal.'
  - His greatest source of inspiration is Nob Ruijgrok — his father, and a former partner of Piet Hein Eek. Nob's dedication and unwavering love for the craft remain a daily motivation, and his furniture
    collection is carried forward here with a fresh eye, new materials and an individual hand.
  - The work begins with solid wood, a living material that changes and carries its own story. The designs are taut and constructive, yet warm and unassuming in use, often built from repeating elements
    that create rhythm and calm. Not a passing trend, but a durable, timeless object.
