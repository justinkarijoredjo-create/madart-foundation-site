arno-hoogland:
  bio: Arno Hoogland is a designer shaped by futurism — artifacts arriving from realities not yet built. As GROUND’s house artist, his milled wall reliefs provide the surface against which every other position
    in the season is read.
  category: artist
  hover: t-arno-hoogland-deus-ex-machina.jpg
  hover_small: h-arno-hoogland-deus-ex-machina.jpg
  instagram: https://www.instagram.com/arnohoogland
  kind: maker
  name: Arno Hoogland
  portrait: portrait-arno-hoogland.jpg
  portrait_small: p-portrait-arno-hoogland.jpg
  position:
  - Within GROUND, Arno Hoogland holds the position of host rather than guest. As the season's house artist his practice does not illustrate the theme of identity and self-expression; it supplies the surface
    against which every other position in the exhibition is read.
  - His reliefs are not images of elsewhere but fragments of a future already partly built. Where the other makers in GROUND excavate identity through memory, material or body, Hoogland constructs it forward
    — proposing that the self, like the surfaces he mills, is assembled rather than discovered.
  practice:
  - 'Arno Hoogland is a designer shaped by futurism — by the urge to make things that feel otherworldly, artefacts arriving from realities not yet built. Unbound by the constraints of the present, his wall
    panels work as windows onto other worlds: eclectic in surface, consistent in intent, each one a sample returned from a future still waiting to be found.'
  - 'The same vision runs beyond the wall, into interiors ranging from houseboats to hotels and into kinetic installation. At Milan Design Week he presented Temple of the Future: in the exhibition Deus
    Ex Machina a CNC machine milled continuously for a week, assembling a tribute to MDF in real time. Material as ritual, manufacturing as performance.'
  programme: ground
