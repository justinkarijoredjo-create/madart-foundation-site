  works:
  - devoonsounds-devoon-drop
  - devoonsounds-original-1
  - devoonsounds-original-2
  - devoonsounds-original-3
  - devoonsounds-original-4
  floor: 4
  rooms:
  - Gallery 2
  practice:
  - 'Devoonsounds works from a simple provocation: that sound has been exiled to the background of the room, boxed into black plastic and tucked out of sight. Founded by industrial designer Joerie Gennisse,
    the studio treats the speaker not as equipment but as sculpture — an object with the right to be looked at as long as it is listened to.'
  - Each piece begins with stone. Discarded Carrara marble is reduced to a fine mineral powder and reintroduced through a 3D-printing process the studio developed itself; other works are hand-cast in eco-resin,
    each surface carrying its own marbled grain. What results are forms with a geological patience to them — built, as the studio puts it, from the earth, to outlast the room they are placed in.
  position:
  - 'On the seventh floor, under a dome built in 1933 to let light fall into a house, Devoonsounds places objects built to let sound fall the same way — unhidden, unapologetic, at the centre of the room
    rather than its edge. A house is where sound is usually silenced into convenience; here it is given weight, texture, a place to stand. The gesture is quiet but total: nothing here pretends to be furniture
    that happens to play music. It is, plainly, an instrument the room is asked to live with.'
  enquiry_note: MADART Foundation takes no commission and is not a party to the sale. Enquiries go directly to Joerie Gennisse.
