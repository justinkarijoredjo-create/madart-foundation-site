    she transforms the residue of experience.
  practice:
  - Billie-Jo Krul is a Dutch-Canadian photographer with a background in art history from Utrecht University. Her work moves between photography and fine art, using the camera as a tool for emotional archaeology.
  - Her ongoing series Broad Daylight was born from a period of grief — a sustained attempt to give form to what cannot easily be spoken. In 2025 the series received a FEP Merit Award in the category Illustration
