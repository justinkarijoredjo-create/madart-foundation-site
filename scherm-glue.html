:root{--archive:#1E1D1C;--dawn:#293DCE;--chalk:#F4EDE4;--linen:#E1DAD2;--concrete:#C3BDB8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--archive);overflow:hidden;cursor:none}
body{font-family:'Chivo Mono',monospace;color:var(--archive)}
#stage{position:absolute;left:50%;top:50%;transform-origin:0 0;background:var(--chalk);overflow:hidden}
.L #stage{width:1920px;height:1080px}.P #stage{width:1080px;height:1920px}
.scene{position:absolute;inset:0;padding:64px 80px;opacity:0;transition:opacity 1.2s ease}
.scene.on{opacity:1}
.top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.mark{font-weight:900;color:var(--dawn);font-size:44px;line-height:.92;letter-spacing:-.02em}
.meta{font-size:20px;line-height:1.4;text-align:right}
.bar{position:absolute;left:80px;right:80px;bottom:52px;display:flex;justify-content:space-between;font-size:19px;border-top:2px solid var(--archive);padding-top:14px;z-index:2}
/* night */
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(41,61,206,.95) 0,rgba(41,61,206,.78) 34%,rgba(41,61,206,.3) 58%,rgba(41,61,206,0) 71%)}
.L .orb{width:1250px;height:1250px;right:-260px;top:-120px}.P .orb{width:1300px;height:1300px;right:-380px;bottom:-240px}
.n-body{position:relative;z-index:2;display:grid}
.L .n-body{grid-template-columns:1fr 540px;gap:80px;margin-top:30px}
.P .n-body{grid-template-columns:1fr;margin-top:90px}
.n-body h1{font-weight:900;font-size:176px;line-height:.84;letter-spacing:-.05em;margin:14px 0 20px -6px}
.P .n-body h1{font-size:190px}
.when{font-size:26px}
.time{font-weight:900;font-size:58px;color:var(--dawn);letter-spacing:-.02em}
.acts{list-style:none;margin-top:34px;border-top:2px solid var(--archive);max-width:900px}
.acts li{display:grid;grid-template-columns:90px 1fr;align-items:baseline;padding:14px 0;border-bottom:2px solid var(--archive)}
.acts b{font-weight:900;font-size:60px;line-height:.9;color:var(--dawn)}
.acts span{font-size:30px;font-weight:700}.acts em{font-style:normal;font-weight:400;font-size:21px;margin-left:18px}
.fine{font-size:24px;margin-top:26px;line-height:1.45}
.qrbox{background:#fff;padding:26px 26px 22px;align-self:end}
.L .qrbox{margin-bottom:70px}
.P .row{padding:30px 0;grid-template-columns:200px 130px 1fr}.P .row .w{font-size:33px}.P .row .w small{font-size:23px}.P .row .f{font-size:54px}.P .t-body h1{font-size:124px;margin-top:70px}.P .sub{font-size:26px;margin-bottom:44px}
.P .qrbox{width:600px;justify-self:end;margin-top:70px}
.qrbox svg{display:block;width:100%;height:auto}
.qrbox p{text-align:center;font-weight:900;font-size:30px;margin-top:14px}.qrbox p span{display:block;font-weight:400;font-size:20px;margin-top:4px}
.now .time:after{content:'';}
/* today */
.t-body h1{font-weight:900;font-size:110px;line-height:.88;letter-spacing:-.04em;margin:36px 0 10px}
.sub{font-size:24px;margin-bottom:30px}
.rows{display:grid;gap:0 70px}
.L .rows{grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(5,auto)}
.row{display:grid;grid-template-columns:190px 110px 1fr;align-items:baseline;padding:17px 0;border-top:2px solid var(--archive);transition:opacity .6s}
.row .t{font-size:25px;font-weight:700}.row .f{font-weight:900;font-size:46px;color:var(--dawn);line-height:.9}
.row .w{font-size:28px;font-weight:700}.row .w small{display:block;font-weight:400;font-size:20px;margin-top:4px}
.row.past{opacity:.28}
.row.live .t:after{content:'Now';display:block;width:max-content;margin-top:6px;background:var(--dawn);color:#fff;font-size:17px;padding:2px 9px;font-weight:400}
/* building */
.b-body{display:grid}
.L .b-body{grid-template-columns:640px 1fr;gap:90px;margin-top:20px}
.P .b-body{grid-template-columns:1fr;margin-top:60px}
.b-body h1{font-weight:900;font-size:110px;line-height:.88;letter-spacing:-.04em}
.b-body .intro{font-size:26px;line-height:1.45;margin-top:28px;max-width:600px}
.stack{list-style:none;border-top:2px solid var(--archive)}
.P .stack{margin-top:60px}
.P .stack li{padding:20px 0}.P .stack b{font-size:72px}.P .stack span{font-size:34px}.P .stack em{font-size:23px}
.P .bar{font-size:16px;gap:20px}
.P .acts span{font-size:34px}.P .acts em{font-size:23px}
.stack li{display:grid;grid-template-columns:110px 1fr;align-items:baseline;padding:11px 0;border-bottom:2px solid var(--archive)}
.stack b{font-weight:900;font-size:56px;line-height:.85;color:var(--dawn)}
.stack span{font-size:29px;font-weight:700}.stack em{display:block;font-style:normal;font-weight:400;font-size:21px;margin-top:5px}
.stack li.here{background:var(--dawn);color:#fff;padding-left:18px;margin-left:-18px}.stack li.here b{color:#fff}
@media (prefers-reduced-motion:reduce){.scene{transition:none}}

const DAYS={thu:['Thursday 17 September',17],fri:['Friday 18 September',18],sat:['Saturday 19 September',19]};
const Q=new URLSearchParams(location.search);
function amsNow(){

  let mins=(+p.hour)*60+(+p.minute);
  if(!Object.keys(DAYS).some(k=>+p.day===DAYS[k][1]&&p.month==='09'&&p.year==='2026')) mins=9*60;
