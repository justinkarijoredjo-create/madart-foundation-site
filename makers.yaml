  practice:
  - 'Dot Objects works in two materials only: steel and wood. Founded in 2024 by Wiktoria Markiewicz, who trained in Interior Architecture & Furniture Design at the Royal Academy of Art in The Hague, the
    studio treats restraint as a form of honesty rather than a limitation.'
  - 'Every steel component is welded by a trusted metalworker in Poland; every wooden element is hand-oiled in-house. The chain stays short and visible, from raw material to finished object, and the objects
    carry that transparency in their form: flat planes, sharp folds, structure left in view rather than concealed.'
  - Markiewicz designs from a conviction that furniture should register individuality rather than smooth it away — that craftsmanship and accessibility are not opposites, and that a home built from considered
    objects looks different from one built from uniform ones.
  position:
  - 'Dot Objects does not exhibit inside Maison d’Artiste so much as furnish it. The grid structures — steel folded into shelf, table, holder — are what other makers’ work is placed on and within, across
    the rooms of the sixth floor. That is a different kind of exposure than a plinth or a wall: the object has to hold weight, survive handling and keep working after the doors close, while still reading
    as considered rather than merely functional.'
  - It is a fitting test for a practice built on the idea that restraint is not the absence of character. In a house, furniture is what makes daily use and formal presence coexist — exactly the territory
    Dot Objects has been designing for since 2024.
