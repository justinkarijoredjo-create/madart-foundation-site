loutje-hoekstra:
  bio: "Loutje Hoekstra (1994) is an Amsterdam-based artist with a background in\n  biology. Her practice unfolds through painting, performance and illustration, revolving\n  around the human body in its\
    \ continuous search for belonging."
  category: artist
  hover: t-Seated_crop.jpg
  hover_small: h-Seated_crop.jpg
  in_brief:
  - text: Eritage, Lisbon
    year: '2026'
