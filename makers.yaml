  - The Drawing Room
  - The Dining Room
  - The Conservatory
  enquiry_note: Each piece shown here is designed for Ignore by an independent Dutch designer and produced locally in the Netherlands. MADART Foundation takes no commission and is not a party to the sale.
    Enquiries go directly to Ignore — julien@ignoreamsterdam.com.
  practice:
  - 'Ignore is an Amsterdam design studio making minimalist furniture and interior objects with a distinct, timeless character. It works with Dutch designers and produces its collections locally in the
    Netherlands, with quality, craftsmanship and flexibility in customisation at the centre. The collection — dining tables, chairs, lounge furniture — is reduced to its essence: clear forms, durable materials,
    carefully considered details, built to last rather than to follow a season.'
  position:
  - 'Most of Maison d’Artiste asks what happens when a maker’s authority enters a room built for living. Ignore approaches from the opposite side: it makes what the room is built around. A table, a chair,
    a lounge piece — the furniture that decides where people sit, how long they stay, and what a space is for. Three designers work here under a single label, and the label’s name states its position plainly
    enough. What arrives on the sixth floor is not decoration but structure: linoleum that holds its colour under daily use, upholstery that still has to be comfortable at the end of an evening. These are
    the pieces that remain once everything set on them has been cleared away.'
  designers:
  - name: Gerard de Hoop
    collection: Modulate
    portrait: portrait-ignore-gerard-de-hoop.jpg
    codes:
    - MAISONDARTISTE-IG-03
    collection_text: Modulate is a lounge chair assembled from distinct volumes — seat, back, arms — that read as slabs set against one another rather than joined into a single mass. The geometry is elementary;
      the effect is not. Set low and deep, it holds a body without ceremony and reads, from across a room, as one block of colour.
    bio: Gerard de Hoop is a Dutch product and furniture designer based in Groningen, trained in architectural and interior design at the Minerva Art Academy. His work is minimal, functional and conceptual,
      built from simple geometric shapes arranged until they produce a certain tension — the element of surprise he consistently works toward. His furniture is held by Pols Potten, Gelderland, Castelijn,
      Casala, Odesi, Moome and Monoprix.
  - name: Jan Willem van Elten
    collection: Shift
    portrait: portrait-ignore-jan-willem-van-elten.jpg
    maker_page: jan-willem-van-elten.html
    codes:
    - MAISONDARTISTE-IG-05
    collection_text: 'Shift is a dining chair on a slender steel frame, its upholstered seat and back held slightly apart from the structure that carries them. That small separation is the design: the chair
      stays visually light from every angle while remaining braced for daily use at a table.'
    bio: Jan Willem van Elten is a Dutch product designer and maker, trained in product design and engineering. He works from sketch to three-dimensional model, searching for the one detail that gives a
      product its character, and considers a design successful only when client, manufacturer and end user are all served by it — with the smallest possible burden on the environment.
  - name: Marc Th. van der Voorn
    collection: Serve, Dine & Conference
    portrait: portrait-ignore-marc-th-van-der-voorn.jpg
    maker_page: marc-th-van-der-voorn.html
    codes:
    - MAISONDARTISTE-IG-01
    - MAISONDARTISTE-IG-02
    - MAISONDARTISTE-IG-04
    collection_text: 'Three tables in furniture linoleum, one logic. Serve stands on a single column sized for two. Dine sets its top on a folded, wrapped base that conceals where the structure begins.
      Conference carries the same thinking to the length of a room. The linoleum is not a finish but the argument: matte, warm under the hand, its colour running through the material rather than laid across
      it, and made to survive being used every day.'
    bio: Marc Th. van der Voorn is an established, award-winning Dutch furniture designer working from Everdingen. His approach is practical, hands-on and collaborative; self-initiated projects let him
      experiment with materials and push production processes that later find their way into commercial work. He has been involved with Ignore since the beginning, and his designs consistently carry an
      element of surprise — a floating edge, opposing legs, a carefully wrapped base.
