friend:
  standfirst: A yearly gift to MADART Foundation, and a way to stay close to the work. Three tiers, all of them gifts, all of them carrying only what a gift may carry.
  frame: You get no admission, no discount and no priority — those live with Curated by MADART, where they belong. What you get is that every euro a maker earns here stays with the maker.
  why: Dutch tax law is precise about this. A contribution counts as a deductible gift only when nothing of real value is given in return, or when what is given is merely symbolic. Free admission to an
    event is explicitly not symbolic. That is why Friend of MADART Foundation carries no admission, no discount and no priority — and why the membership that does carry those things lives with Curated by
    MADART instead, where it belongs.
  tiers:
  - name: Friend
    amount: € 50 a year — around four euros a month
    link: ''
    benefits:
    - The season letter, three or four times a year — what we chose, and why
    - First word on a new season before it is announced publicly
    - A written account of where the year's gifts went
  - name: Supporting Friend
    amount: € 250 a year
    link: ''
    benefits:
    - Everything in Friend
    - Your name in the annual report, if you want it there
    - The curatorial notes behind each season's selection, in full
  - name: Founding Friend
    amount: € 1,000 a year
    link: ''
    contact_only: true
    note: At this level we would rather speak first. Write to us and we will arrange a conversation about the year ahead before anything is signed.
    benefits:
    - Everything in Supporting Friend
    - A yearly curatorial letter on the season ahead, written once and sent to every Founding Friend
    - Named as a Founding Friend in the Foundation's published record
