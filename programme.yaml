    - anchor: vr-talk-voorn
      time: 16:00 – 17:00
      floor: 2
      title: Material as the deciding factor
      body: 'How does an idea grow into a successful design? Marc Th. van der Voorn takes you through his process: from the first sketch and the choice of material to form, detailing and production.'
      status: book
      maker: marc-th-van-der-voorn
      who: Marc Th. van der Voorn
      language: In Dutch
      body2: Using his own work, he shows how material is not only a practical choice but can be the factor that decides whether a design succeeds.
      book_url: https://www.eventbrite.com/checkout-external?eid=2000085446411
