  enquiry_note: Each piece shown here is made in collaboration with its designer for Buro Berger. MADART Foundation takes no commission and is not a party to the sale. Enquiries go directly to Buro Berger
    — hello@buroberger.nl.
  practice:
  - Buro Berger is a contemporary design label rooted in craftsmanship and accessible design, established as an extension of the Dutch design company &Klevering. It works with established and emerging designers
    alike, translating each one’s visions into collectible, functional pieces — objects that bring personality, colour and character into an interior, in the Dutch tradition of innovative design.
  position:
  - 'Buro Berger arrives at Maison d’Artiste not as a single authorial voice but as a constellation of five. Where much of this exhibition asks what happens when one maker’s authority meets a room built
    for living, Buro Berger poses the inverse: what happens when a room absorbs five distinct hands at once — glass, mirror, wood, porcelain, metal — each object designed to be touched, filled, lit or set
    at a table. Nothing here waits behind glass. In a house built for habitation, these objects don’t just occupy the room. They wait to be used in it.'
  designers:
  - name: Bertjan Pot
    collection: Dotty
    portrait: portrait-buro-berger-bertjan-pot.jpg
    codes:
    - MAISONDARTISTE-BB-06
    - MAISONDARTISTE-BB-07
    - MAISONDARTISTE-BB-08
    collection_text: Mirrors can be quite honest. Dotty lays a field of dots over the reflection, merging with the image and gently blurring what it returns. The interplay between a graphic grid and a realistic
      image runs through Bertjan Pot’s work; here the mirror turns the pattern into a three-dimensional grid, while the image itself keeps being reshaped by whatever stands in front of it.
    bio: Bertjan Pot is a Dutch designer and artist known for a curiosity-driven approach to materials, patterns and construction. His work tends to start in experimentation and arrives at designs that
      combine craftsmanship, function and visual intrigue — from lighting to textiles and furniture, playful in character and technically inventive.
  - name: Boris de Beijer
    collection: Cassata Collezione
    portrait: portrait-buro-berger-boris-de-beijer.jpg
    codes:
    - MAISONDARTISTE-BB-01
    - MAISONDARTISTE-BB-02
    - MAISONDARTISTE-BB-03
    - MAISONDARTISTE-BB-04
    - MAISONDARTISTE-BB-05
    collection_text: 'Cassata Collezione is handblown table glass made with the same methods the Greeks and Romans used, and named — with a wink — after the colourful Sicilian dessert whose history reaches
      back just as far. The techniques are straightforward and hide nothing: small flaws stay visible, so no two pieces are the same.'
    bio: Boris de Beijer is a Dutch designer and artist based in The Hague. After graduating from the Gerrit Rietveld Academie in 2011 he built a practice that moves between design, craft and sculpture,
      turning common materials into objects that read as glass, mineral or precious metal. His work has been shown internationally and is held in collections including the Stedelijk Museum Amsterdam, CODA
      Museum and MAD Museum in New York.
  - name: Carole Baijings
    collection: Horizons
    portrait: portrait-buro-berger-carole-baijings.jpg
    codes:
    - MAISONDARTISTE-BB-10
    - MAISONDARTISTE-BB-11
    - MAISONDARTISTE-BB-12
    collection_text: 'Horizons is a salt and pepper set built as a canvas for colour. The shape is kept minimal so the translucent tones can do the work: set the three pieces side by side and a horizon
      appears. The combinations come out of Baijings’ hand-made wooden colour studies, where each pairing sharpens the next.'
    bio: Carole Baijings is a Dutch designer known for her use of colour, material and craft. She works from an atelier practice, developing designs through hands-on experimentation with colour, transparency
      and form. Her collaborations with international brands and museums have produced a wide body of timeless design.
  - name: Martin Hirth
    collection: Beln
    portrait: portrait-buro-berger-martin-hirth.jpg
    codes:
    - MAISONDARTISTE-BB-13
    - MAISONDARTISTE-BB-14
    collection_text: 'Beln is a table lamp of bent metal: a precise hexagonal base carrying three softly curved shades, almost sculptural, almost confectionery. It plays openly with light and shadow, throwing
      reflections and graphic contrasts that shift through the day — geometry and softness in the same object.'
    bio: Martin Hirth is a German designer whose work balances function, material and innovation. With a strong focus on craftsmanship and industrial production, he makes objects that are practical and
      visually precise, with a clear identity that outlasts the moment.
  - name: Nynke Tynagel
    collection: Bluedot
    portrait: portrait-buro-berger-nynke-tynagel.jpg
    codes:
    - MAISONDARTISTE-BB-09
    - MAISONDARTISTE-BB-15
    - MAISONDARTISTE-BB-16
    collection_text: 'The Bluedot series is a contemporary reading of Delft Blue. Instead of windmills, florals and ships it works with pattern and rhythm: layered blues building compositions that keep
      the ornamental logic of Delft ceramics while speaking a more abstract language.'
    bio: Nynke Tynagel is a Dutch designer and artist known for bold colour, pattern and graphic expression. Her work moves between art and design, drawing on everyday life, architecture and visual culture
      to make pieces that are playful and precise at once.
