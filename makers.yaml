  bio: 'Minimalist furniture made in the Netherlands, by three Dutch designers under one label: dining tables, chairs and lounge pieces reduced to clear forms, durable materials and considered detail.'
  category: partner
  hover: t-ignore-modulate-lounge-chair.jpg
  hover_small: h-ignore-modulate-lounge-chair.jpg
  instagram: https://www.instagram.com/ignoreamsterdam
  kind: partner
  members:
  - Gerard de Hoop
