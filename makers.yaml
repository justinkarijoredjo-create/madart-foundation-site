joost-de-munnik-ruud-van-den-eijnden:
  bio: A furniture maker and a mechanism specialist build an entrance piece around an inherited clock movement. Oak, walnut and ceramic are cut to the rhythm the brass keeps; a bonsai above holds a slower
    measure against it. Presented by SPoT Den Haag, guest at Maison d'Artiste.
  category: artist
  collective: spot-den-haag
  hover: t-joost-de-munnik-ruud-van-den-eijnden-entree-meubel.jpg
  hover_small: h-joost-de-munnik-ruud-van-den-eijnden-entree-meubel.jpg
  in_brief:
  - text: Maison d'Artiste, GLUE Amsterdam — SPoT Den Haag as guest
    year: '2026'
  - text: SPoT Den Haag — alumni platform, four-week presentation
    year: '2026'
  - text: Build time, kept as part of the work
    year: 237 h
  instagram: null
  kind: maker
  name: Joost de Munnik & Ruud van den Eijnden
  portrait: portrait-joost-de-munnik-ruud-van-den-eijnden.jpg
  portrait_small: p-portrait-joost-de-munnik-ruud-van-den-eijnden.jpg
  position:
  - An entrance piece is the most transitional object in a house. It is the last surface touched on the way out and the first on the way back — where a household leaves its keys, its post, and its estimate
    of how late it already is.
  - On the sixth floor, in rooms built for living but not yet lived in, the work proposes a threshold the architecture does not provide. A clock ticks inside it. A bonsai holds a slower measure against
    it. The two are made to share one span of oak, and neither wins.
  - Where shall we meet, and at what time. The makers name this as the question the piece was built from. It is a domestic question, asked here in rooms that have not yet decided whose home they are.
  practice:
  - 'Joost de Munnik and Ruud van den Eijnden built this piece around something that was already running. A clock movement from a family heirloom — brass, worn, still keeping time — became the point from
    which everything else was measured: the oak, the walnut uprights, the cone that holds a bonsai above a floor it never touches.'
  - De Munnik works as a furniture maker; van den Eijnden brings the specialist's hand for mechanisms that have outlived their first owners. The collaboration ran to 237 hours. They keep the figure, because
    in this piece duration is not overhead but subject.
  - They present through SPoT Den Haag, a platform where students and alumni show work for four weeks while continuing to work in their own workshops — neither gallery nor shop. At Maison d'Artiste, SPoT
    appears as a guest.
  presented_by: SPoT Den Haag
