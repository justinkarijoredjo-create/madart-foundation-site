{# De opmaak van de site, letterlijk overgenomen uit style.css en
   _programmestyle.html, zodat een gescande pagina niet als een formulier van
   een derde partij leest. Alles staat hier inline: de pagina is zelfdragend. #}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--chalk:#F4EDE4;--ink:#1E1D1C;--linen:#E1DAD2;--concrete:#C3BDB8;
  --grey:#5A5650;--grey-light:#64605A;--dawn:#293DCE;--gut:24px;
  --rule:1px solid var(--concrete);--hair:1px solid var(--linen)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Chivo Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:14px;line-height:1.6;background:var(--chalk);color:var(--ink);
  font-variant-ligatures:none}
.wrap{max-width:640px;margin:0 auto;padding:0 var(--gut)}
.index{display:flex;gap:14px;align-items:baseline;font-size:11px;font-weight:400;
  letter-spacing:.16em;color:var(--grey);padding:34px 0 10px;margin:0;
  text-transform:uppercase}
h1{font-size:clamp(26px,3.4vw,40px);line-height:1.08;letter-spacing:-.02em;
  font-weight:700;margin:0 0 16px}
h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey);
  font-weight:400;margin:0 0 10px}
.lede{font-size:clamp(15px,1.5vw,17px);line-height:1.62;max-width:62ch;
  color:var(--ink);margin:0 0 18px}
p{margin:0 0 18px}
a{color:var(--dawn)}
/* het label-en-regelpatroon van de programmapagina */
.praktisch{margin:26px 0 0;padding:22px 0 0;border-top:var(--rule)}
.praktisch > div{display:grid;grid-template-columns:104px 1fr;gap:16px;padding:12px 0;
  border-bottom:var(--hair)}
.praktisch dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--grey);font-weight:700}
.praktisch dd{margin:0;font-size:14px;line-height:1.6}
.paneel{border-top:var(--rule);margin:34px 0 0;padding:22px 0 0}
.paneel p{margin:0;font-size:14px;line-height:1.6}
.scheiding{font-size:14px;line-height:1.6;margin:18px 0 0}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--grey);font-weight:700;margin:20px 0 7px}
input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;font-size:16px;
  padding:13px 12px;border:1px solid var(--concrete);background:#fff;color:var(--ink);
  border-radius:0}
input:focus{outline:2px solid var(--dawn);outline-offset:1px}
.vink{display:flex;gap:12px;align-items:flex-start;margin:18px 0 0;font-size:14px;
  line-height:1.6}
.vink input{width:20px;height:20px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--dawn)}
.vink label{text-transform:none;letter-spacing:0;font-weight:400;font-size:14px;
  color:var(--ink);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;
  font-size:13px;padding:13px 22px;border:1px solid var(--ink);cursor:pointer;
  background:var(--ink);color:var(--chalk);width:100%;margin:30px 0 0}
.btn:hover{background:var(--dawn);border-color:var(--dawn)}
.btn[disabled]{opacity:.55;cursor:default}
.klein{font-size:11px;line-height:1.7;color:var(--grey-light);margin:26px 0 0}
footer{border-top:var(--hair);margin:26px 0 0;padding:18px 0 44px}
.fout{border-left:2px solid var(--dawn);background:var(--linen);padding:11px 14px;
  font-size:13px;margin:22px 0 0}
.klaar{padding:44px 0 60px}
.klaar h2{font-size:clamp(22px,3vw,30px);letter-spacing:-.02em;text-transform:none;
  color:var(--ink);font-weight:700;margin:0 0 12px}
[hidden]{display:none !important}
@media(max-width:560px){ .praktisch > div{grid-template-columns:1fr;gap:3px} }
</style>
