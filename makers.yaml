  practice:
  - Natalia Wyspianska is a ceramic artist based in Amsterdam, whose practice explores the relationship between nature and the forces that shape the world around us. Working primarily in stoneware, she
    makes sculptural, organic forms that sit between function and abstraction. Her pieces are made through a combination of wheel throwing, hand-building and altering, allowing the material to retain traces
    of movement, pressure and touch.
  - Layered surfaces and tactile textures transform familiar ceramic forms into something more visceral and alive. Nature is a constant point of reference within her work. Inspired by coral reefs, marine
    ecosystems, plants and organic forms, she explores the beauty of movement and imperfection through shape, texture and colour.
  - Her process is deliberately slow and intuitive. Rather than seeking perfect symmetry or control, she embraces irregularity and the evidence of the hand. Each piece develops through a dialogue between
    intention and material, with firing becoming an essential part of the process — a moment when the artist ultimately must surrender control.
  position:
  - 'Wyspianska works at the scale of things people live with, and her forms ask for none of the ceremony a plinth usually demands. Set into rooms built for rest, they introduce a different tempo: rims
    still lifting, surfaces opened into pore and cavity, matter held at the moment the kiln took control.'
  - The palette completes the argument. The pale Aqua and Shell works recede into daylight and return at dusk; the Terra pieces absorb the warmth of a room and darken with it. Nothing here settles into
    decoration. The house is asked to accommodate something that is, quietly, still in motion.
