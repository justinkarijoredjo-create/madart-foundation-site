      time: 15:00 – 16:00
      floor: 2
      title: Rietveld × linoleum × 3
      who: Thomas Eurlings, Senior Designer at Forbo Flooring
      status: book
      speaker: Thomas Eurlings
      label: Partner programme
      language: In Dutch
      body: Thomas Eurlings on three projects where Gerrit Rietveld's work and linoleum come together. From historical colour research and restoration to a new application of Furniture Linoleum on a classic
        Rietveld design.
      body2: Across the three projects, the range of linoleum as a design and interior material becomes visible.
      book_url: https://www.eventbrite.com/checkout-external?eid=2000085446411
      book_label: Book
